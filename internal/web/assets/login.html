<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>containerctl · login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2379c0ff'%3E%3Cpath d='M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function() {
      // Minimal theme support on login (respects localStorage + system)
      const saved = localStorage.getItem('containerctl-theme') || 'auto';
      let theme = saved;
      if (saved === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">containerctl</div>
    <div class="login-error" id="err" style="display:none"></div>
    <form method="POST" action="/login" id="login-form">
      <input type="password" name="token" id="token-input" placeholder="Access token" autofocus autocomplete="current-password">
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <div style="margin-top:0.75rem;font-size:0.75rem;color:var(--text-muted);text-align:center;opacity:0.7">
      containerctl web terminal
    </div>
  </div>
  <script>
    (function () {
      const params  = new URLSearchParams(location.search);
      const errType = params.get('error');
      const errDiv  = document.getElementById('err');
      const btn     = document.getElementById('submit-btn');
      const input   = document.getElementById('token-input');
      const form    = document.getElementById('login-form');

      if (errType === '1') {
        errDiv.textContent = 'Invalid token. Please try again.';
        errDiv.style.display = 'block';
      } else if (errType === 'expired') {
        errDiv.textContent = 'Your session has expired. Please sign in again.';
        errDiv.style.display = 'block';
      } else if (errType === 'blocked') {
        let sec = Math.max(1, parseInt(params.get('sec') || '30', 10));
        errDiv.style.display = 'block';
        btn.disabled = true;
        input.disabled = true;

        function tick() {
          if (sec <= 0) {
            errDiv.textContent = 'You may try again now.';
            btn.disabled = false;
            btn.textContent = 'Sign in';
            input.disabled = false;
            input.focus();
            return;
          }
          errDiv.textContent =
            'Too many failed attempts. Try again in ' + sec + ' second' + (sec === 1 ? '' : 's') + '.';
          btn.textContent = sec + 's';
          sec--;
          setTimeout(tick, 1000);
        }
        tick();
      }

      // Simple loading state on submit (no page flash)
      if (form && btn) {
        form.addEventListener('submit', function () {
          btn.disabled = true;
          btn.textContent = 'Signing in…';
        });
      }
    })();
  </script>
</body>
</html>
